name: Build

on:
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Ant contrib libraries
        uses: actions/cache@v4
        with:
          path: ~/.ant/lib
          key: ${{ runner.os }}-ant-contrib

      - name: Build with Ant
        run: |
          cd projectlibre_build
          ant compile

      - name: Run tests
        run: |
          cd projectlibre_build
          ant test || echo "No test target configured"
